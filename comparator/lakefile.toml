# Lean formalization for the paper on Springer's 1951 inverse-coefficient conjecture.
name = "SpringerLean"
version = "0.1.0"
defaultTargets = ["Springer"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "Springer"
globs = ["Springer", "Springer.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
weakLeanArgs = ["-j1"]

[[lean_lib]]
name = "Challenge"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
weakLeanArgs = ["-j1"]
